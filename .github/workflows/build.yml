name: Build

# Docs, screenshots, the repo index and the issue templates don't change the build.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'repo.json'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/scripts/**'
      - '.github/dependabot.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'repo.json'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/scripts/**'
      - '.github/dependabot.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud dev files
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Force "$env:RUNNER_TEMP\dalamud.zip" "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore
