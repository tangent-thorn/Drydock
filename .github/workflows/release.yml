name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud dev files
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Force "$env:RUNNER_TEMP\dalamud.zip" "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Version from the project
        id: ver
        shell: pwsh
        run: |
          $xml = [xml](Get-Content Drydock/Drydock.csproj)
          $version = ($xml.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1).Trim()
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if (-not $version.StartsWith($tag)) { throw "Tag $tag does not match the csproj Version $version" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Changelog into the plugin manifest
        shell: pwsh
        run: ./.github/scripts/Set-ReleaseChangelog.ps1 -Version "${{ steps.ver.outputs.tag }}" -ChangelogPath CHANGELOG.md -NotesFile "$env:RUNNER_TEMP/notes.md" -Manifest Drydock/Drydock.json

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build Release
        run: dotnet build --configuration Release --no-restore

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "Drydock/bin/x64/Release/Drydock/latest.zip"
          if (-not (Test-Path $zip)) { throw "Package not found: $zip" }
          gh release create "${{ github.ref_name }}" $zip --title "Drydock ${{ steps.ver.outputs.version }}" --notes-file "$env:RUNNER_TEMP/notes.md"

      - name: Checkout main for repo.json
        uses: actions/checkout@v5
        with:
          ref: main
          path: main

      - name: Update repo.json
        shell: pwsh
        working-directory: main
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $link = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/latest.zip"
          $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds().ToString()
          $json = Get-Content repo.json -Raw | ConvertFrom-Json
          $entry = $json | Where-Object { $_.InternalName -eq 'Drydock' }
          $entry.AssemblyVersion = $version
          $entry.DownloadLinkInstall = $link
          $entry.DownloadLinkUpdate = $link
          $entry.DownloadLinkTesting = $link
          $entry.LastUpdate = $now
          $out = ConvertTo-Json -InputObject @($json) -Depth 10
          [System.IO.File]::WriteAllText("$PWD/repo.json", $out + "`n", (New-Object System.Text.UTF8Encoding($false)))

      - name: Changelog into repo.json
        shell: pwsh
        working-directory: main
        run: ../.github/scripts/Set-ReleaseChangelog.ps1 -Version "${{ steps.ver.outputs.tag }}" -ChangelogPath ../CHANGELOG.md -Manifest repo.json

      - name: Commit repo.json
        shell: pwsh
        working-directory: main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Release ${{ github.ref_name }}: update repo.json"
            git push origin HEAD:main
          }
