name: Idea
description: Something Drydock should show or do
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you'd want
      description: What you'd look at it for, more than how it should look
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where the data would come from
      description: Optional. Drydock reads AutoRetainer, Submarine Tracker, Allagan Tools and CashFlow files only.
